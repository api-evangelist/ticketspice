description: >-
  FinOps view of TicketSpice spend. TicketSpice is a Webconnex product with a
  usage-based, per-ticket cost model rather than a subscription: a flat fee per
  ticket sold (0.99 USD for paid tickets 5 USD or more, 0.49 USD for paid tickets
  under 5 USD or box-office card sales, free for cash box-office sales, 0.99 USD
  for free-event tickets) plus card processing (2.9 percent plus 0.30 USD via
  Webconnex Payments, or a 1 percent platform fee plus the processor's fees for a
  custom processor). Fees are netted out of organizer payouts by default or passed
  to buyers. The Webconnex REST API used to integrate TicketSpice has no separate
  metered fee beyond account rate limits; the cost driver is ticket volume and
  processing, not API calls.
notes: >-
  Per-unit rates are grounded in the TicketSpice pricing and fees documentation as
  of the review date; verify before use. Premium features (SMS, drip campaigns,
  etc.) add separate per-unit and monthly costs billed to a card on file and
  invoiced every 30 days.
