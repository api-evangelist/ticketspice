principles:
- name: Visibility
  description: Track ticket volume and processing fees per form/event; reconcile against weekly payouts and the 30-day premium-feature invoice.
- name: Allocation
  description: Map costs to events by naming forms per event/campaign so per-ticket and processing fees attribute cleanly.
- name: Optimization
  description: Choose whether to absorb or pass fees to buyers; use the box office card reader for the reduced 0.49 USD per-ticket rate; evaluate Webconnex Payments versus a custom processor.
- name: Accountability
  description: Assign an owner per event to review per-ticket and processing costs against ticket revenue and target margins.
