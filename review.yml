sources:
  - url: https://docs.webconnex.io/api/v2/
    type: APIReference
    note: Official Webconnex v2 API reference - base URL, apiKey auth, endpoints, rate limits, JSON response envelope.
  - url: https://help.regfox.com/en/articles/2340089-rest-api
    type: Documentation
    note: Confirms the shared REST API, API-key auth, GET-oriented data retrieval, per-account burst/daily rate limits, and higher-tier plan gating.
  - url: https://help.ticketspice.com/en/articles/2471509-webhooks
    type: Documentation
    note: TicketSpice webhook events and configuration; HTTP callbacks, no WebSocket.
  - url: https://demo.regfox.com/api-request
    type: Documentation
    note: Webconnex API request page confirming apiKey usage and support contacts.
  - url: https://github.com/webconnex
    type: SourceCode
    note: Webconnex GitHub org (no public API client/SDK for the ticketing API).
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. TicketSpice's own public API is the
    request/response Webconnex REST API plus outbound webhooks (HTTP callbacks).
    No AsyncAPI document was created because there is no server-push transport on
    TicketSpice's own API to model.
