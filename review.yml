    - POST   https://api.webconnex.com/v2/public/registrant/check-out
    - GET    https://api.webconnex.com/v2/public/search/tickets
    - GET    https://api.webconnex.com/v2/public/search/tickets/{id}
    - GET    https://api.webconnex.com/v2/public/search/subscriptions
