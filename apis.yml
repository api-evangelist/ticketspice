aid: ticketspice
url: https://raw.githubusercontent.com/api-evangelist/ticketspice/refs/heads/main/apis.yml
name: TicketSpice
kind: company
description: TicketSpice is an online event ticketing platform built by Webconnex
  that lets organizers design fully customizable ticketing pages and sell tickets
  for events, festivals, tours, and immersive experiences at a flat 99-cent
  per-ticket fee. TicketSpice is powered by the shared Webconnex REST API
  (base https://api.webconnex.com/v2/public), the same read-and-manage API surface
  behind Webconnex products RegFox, RedPodium, and GivingFuel. Callers pass a
  product parameter of ticketspice and authenticate with an apiKey header to
  search and view orders, registrants, tickets, transactions, customers, forms,
  and inventory, manage coupons and webhooks, and check registrants in and out.
  API access is provisioned per account with an API key and is gated to
  higher-tier plans.
